name: Deploy 2B2 AI Edge Function

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'supabase/functions/tubetu-ai/**'
      - '.github/workflows/deploy-tubetu-ai.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Check deployment secret
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Missing SUPABASE_ACCESS_TOKEN in repository Actions secrets. Add it in Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Deploy tubetu-ai function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy tubetu-ai --project-ref zbgfuitelvmkrpzbpcrj
