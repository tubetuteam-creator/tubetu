name: TUBETU AI Core checks

on:
  push:
    paths:
      - "ai-core/**"
      - ".github/workflows/tubetu-ai-core-checks.yml"
  pull_request:
    paths:
      - "ai-core/**"
      - ".github/workflows/tubetu-ai-core-checks.yml"
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install API dependencies
        working-directory: ai-core
        run: python -m pip install -r requirements.txt httpx
      - name: Compile Python files
        working-directory: ai-core
        run: python -m compileall -q main.py photo_listing.py vision_adapter.py test_photo_listing.py test_photo_listing_endpoint.py
      - name: Run photo input validation tests
        working-directory: ai-core
        run: python -m unittest -v test_photo_listing.py test_photo_listing_endpoint.py
