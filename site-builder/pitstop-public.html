<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f5f6f3"><title>Автосервис</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f6f3;color:#202820;font:16px/1.55 Inter,Arial,sans-serif}.wrap{max-width:1080px;margin:auto;padding:0 22px}.top{height:72px;display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{font-size:20px;font-weight:900;letter-spacing:-.5px}.nav{font-size:13px;color:#65736b}.hero{min-height:370px;padding:70px 0 55px;background:linear-gradient(100deg,#101d18dd,#101d1866),url('https://images.unsplash.com/photo-1486006920555-c77dce18193b?q=80&w=1800&auto=format&fit=crop') center/cover;color:white}.eyebrow{font-size:12px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:#a7efc4}.hero h1{font-size:clamp(34px,6vw,64px);line-height:1.02;max-width:780px;margin:15px 0}.hero p{max-width:650px;color:#e1e9e3}.btn{display:inline-block;margin-top:18px;padding:14px 22px;border-radius:9px;background:#168b58;color:white;text-decoration:none;font-weight:800}.section{padding:42px 0}.section h2{font-size:28px;margin:0 0 18px}.services,.prices{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:13px}.item{background:white;border:1px solid #e0e6df;border-radius:14px;padding:18px}.item h3{font-size:17px;margin:0 0 8px}.muted{color:#68766d;font-size:14px}.price{display:flex;justify-content:space-between;gap:12px}.contact{background:#17251e;color:white;padding:34px 0}.contact p{color:#c8d4cc}footer{padding:18px 0;color:#738077;font-size:12px}@media(max-width:600px){.wrap{padding:0 16px}.hero{min-height:320px;padding:52px 0}.nav{display:none}}
</style></head><body>
<header class="wrap top"><div class="brand" id="brand">Автосервис</div><nav class="nav">Услуги　 Цены　 Контакты</nav></header>
<section class="hero"><div class="wrap"><div class="eyebrow" id="city">АВТОСЕРВИС</div><h1 id="headline">Профессиональный автосервис</h1><p id="description"></p><a class="btn" id="cta" href="#">Записаться на ремонт</a></div></section>
<main class="wrap"><section class="section"><h2>Наши услуги</h2><div class="services" id="services"></div></section><section class="section"><h2>Прайс-лист</h2><div class="prices" id="prices"></div></section></main>
<section class="contact"><div class="wrap"><h2>Свяжитесь с нами</h2><p id="contact"></p><a class="btn" id="contactBtn" href="#">Написать в WhatsApp</a></div></section><footer class="wrap">Сайт создан в конструкторе TUBETU</footer>
<script>
const SB_URL='https://zbgfuitelvmkrpzbpcrj.supabase.co';const SB_KEY='sb_publishable_2TBKUjp8mXw1g1Z9WhYxpQ_wJIA-Bk_';const db=window.supabase.createClient(SB_URL,SB_KEY);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
(async()=>{const slug=new URLSearchParams(location.search).get('site');if(!slug){document.querySelector('main').innerHTML='<p class="section">Не указана ссылка на сайт.</p>';return}try{const {data,error}=await db.from('builder_projects').select('title,data').eq('slug',slug).eq('is_published',true).single();if(error)throw error;const d=data.data||{};document.title=d.brand||data.title||'Автосервис';document.getElementById('brand').textContent=d.brand||data.title;document.getElementById('headline').textContent=d.headline||'';document.getElementById('description').textContent=d.description||'';document.getElementById('city').textContent=(d.city||'')+' · АВТОСЕРВИС';document.getElementById('services').innerHTML=(d.services||[]).map(x=>'<article class="item"><h3>'+esc(x.title)+'</h3><p class="muted">'+esc(x.desc)+'</p></article>').join('');document.getElementById('prices').innerHTML=(d.prices||[]).map(x=>'<article class="item price"><span>'+esc(x.name)+'</span><b>'+Number(x.price||0).toLocaleString('ru-RU')+' ₸</b></article>').join('');const phone=String(d.phone||'').replace(/\D/g,'');const wa='https://wa.me/'+phone+'?text='+encodeURIComponent('Здравствуйте! Хочу записаться в '+(d.brand||'автосервис')+'.');for(const id of ['cta','contactBtn']){const el=document.getElementById(id);el.href=wa;el.textContent=id==='cta'?(d.cta||'Записаться на ремонт'):'Написать в WhatsApp'}document.getElementById('contact').textContent=(d.city||'')+' · '+(d.phone||'')}catch(e){document.querySelector('main').innerHTML='<div class="section"><h2>Сайт пока недоступен</h2><p class="muted">Проект не найден или ещё не опубликован. Попробуйте открыть ссылку позже.</p></div>'}})();
</script></body></html>
