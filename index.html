<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#08120e">
<title>TUBETU — People • Business • Resources</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{color-scheme:dark;--bg:#08120e;--panel:#102019;--line:#294334;--text:#edf7ef;--muted:#a1b6a7;--green:#43df80;--red:#ffb4b4}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,sans-serif}
main{max-width:760px;margin:auto;padding:20px 15px}header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:8px 0 24px}
h1{font-size:29px;letter-spacing:2px;color:var(--green);margin:0}h2{font-size:19px;margin:0 0 10px}
.muted,.subtitle{color:var(--muted);font-size:13px}.card,.post{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:16px;margin-bottom:14px}
label{display:block;color:var(--muted);font-size:13px;margin:12px 0 5px}input,textarea,select{width:100%;padding:12px;border:1px solid var(--line);border-radius:9px;background:#09160f;color:var(--text);font:inherit}
textarea{min-height:110px;resize:vertical}button{padding:10px 13px;border:1px solid var(--line);border-radius:9px;background:#14271e;color:var(--text);font:inherit;cursor:pointer}
button.primary{background:var(--green);color:#07140b;border-color:var(--green);font-weight:700}button:disabled{opacity:.55;cursor:wait}
.row,.toolbar,.filters{display:flex;gap:9px;flex-wrap:wrap;margin-top:12px}.row>*{flex:1}.hidden{display:none!important}
.message{padding:10px;border-radius:8px;background:#173724;color:#c6f8d6;font-size:13px;margin-top:12px;overflow-wrap:anywhere}
.message.error{background:#3a2020;color:#ffd0d0}.status{font-size:11px;border:1px solid var(--line);border-radius:20px;padding:5px 9px;color:var(--muted)}
.toolbar input{flex:1;min-width:140px}.filter.active{border-color:var(--green);color:var(--green)}
.post-top{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted)}.tag{border:1px solid #315a40;border-radius:20px;padding:3px 8px;color:var(--green)}
.post h3{font-size:18px;margin:12px 0 6px;overflow-wrap:anywhere}.post-text{white-space:pre-wrap;overflow-wrap:anywhere}
.ai{border-top:1px solid var(--line);padding-top:9px;margin-top:13px;font-size:12px;color:var(--muted)}.ai strong{color:var(--green)}
footer{text-align:center;color:var(--muted);font-size:12px;padding:20px}

/* TUBETU modern responsive design refresh */
:root{color-scheme:dark;--bg:#080d12;--panel:#101922;--line:#253542;--text:#f2f6f8;--muted:#91a3b2;--green:#63e6a2;--red:#ffb4b4;--surface:#0c141c}
*{box-sizing:border-box}
body{min-height:100vh;background:radial-gradient(ellipse at 50% -20%,#173b32 0%,#0b151b 42%,#080d12 78%);color:var(--text);font:15px/1.6 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:.01em}
main{max-width:900px;margin:0 auto;padding:30px 22px 20px}
header{position:relative;display:flex;justify-content:space-between;align-items:center;gap:20px;margin:0 0 32px;padding:20px 0 24px;border-bottom:1px solid #24352f}
h1{font-size:32px;line-height:1.1;letter-spacing:.16em;color:#f5fff9;margin:0;font-weight:850}
.subtitle{font-size:13px;line-height:1.8;color:#9db5aa;margin:9px 0 0}
h2{font-size:20px;letter-spacing:-.025em;margin:0 0 7px;font-weight:750}
.muted,.subtitle{color:var(--muted)}
.card,.post{background:linear-gradient(145deg,rgba(19,31,40,.96),rgba(13,23,30,.97));border:1px solid #293944;border-radius:18px;padding:24px;margin-bottom:18px;box-shadow:0 12px 34px rgba(0,0,0,.13)}
#authCard{max-width:520px;margin:10px auto 28px;padding:30px}
#authIntro{margin:4px 0 20px;font-size:14px}
label{display:block;color:#c1cdd5;font-size:12px;font-weight:650;letter-spacing:.025em;margin:15px 0 7px}
input,textarea,select{width:100%;padding:13px 14px;border:1px solid #30414e;border-radius:11px;background:#0a1219;color:var(--text);font:inherit;outline:none;transition:border-color .18s,box-shadow .18s}
input::placeholder,textarea::placeholder{color:#657988}
input:focus,textarea:focus,select:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(99,230,162,.12)}
textarea{min-height:125px;resize:vertical}
button{padding:11px 15px;border:1px solid #344653;border-radius:11px;background:#15232d;color:#eaf1f5;font:inherit;font-size:13px;font-weight:650;cursor:pointer;transition:transform .15s,border-color .15s,background .15s}
button:hover{border-color:#6b8b7c;background:#1b2d35}
button:active{transform:scale(.985)}
button.primary{background:var(--green);color:#082016;border-color:var(--green);font-weight:800}
button.primary:hover{background:#8bf0ba;border-color:#8bf0ba}
button:disabled{opacity:.55;cursor:wait}
.row,.toolbar,.filters{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.row>*{flex:1;min-width:0}
.hidden{display:none!important}
.message{padding:12px 14px;border-radius:11px;background:#153a2b;border:1px solid #285941;color:#c9f8dd;font-size:13px;margin-top:15px;overflow-wrap:anywhere}
.message.error{background:#3b2225;border-color:#63343b;color:#ffd0d0}
.status{font-size:11px;border:1px solid #31463c;border-radius:999px;padding:6px 11px;color:#a6cbb7;background:rgba(18,44,32,.5);white-space:nowrap}
.toolbar{margin:26px 0 12px}
.toolbar input{flex:1;min-width:180px}
.filters{margin:0 0 18px;gap:8px}
.filter{background:transparent;border-color:transparent;color:#9fb0bc}
.filter.active{border-color:#3b7658;color:var(--green);background:rgba(47,125,81,.15)}
.post{padding:22px 24px}
.post-top{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:12px;color:var(--muted)}
.tag{border:1px solid #34664b;border-radius:999px;padding:4px 10px;color:var(--green);background:rgba(55,140,91,.1);font-size:11px;font-weight:700}
.post h3{font-size:19px;line-height:1.4;letter-spacing:-.02em;margin:15px 0 8px;overflow-wrap:anywhere}
.post-text{white-space:pre-wrap;overflow-wrap:anywhere;color:#d5dfe5}
.ai{border-top:1px solid #273640;padding-top:12px;margin-top:17px;font-size:11px;color:#8196a4}
.ai strong{color:var(--green)}
footer{text-align:center;color:#718591;font-size:11px;padding:30px 10px 12px;letter-spacing:.06em}
#publishCard h2{margin:0}
#publishCard .muted{margin:8px 0}
#publishBtn{min-height:46px}
@media(max-width:600px){main{padding:17px 13px 14px}header{margin-bottom:22px;padding:8px 0 20px;align-items:flex-start}h1{font-size:28px}.subtitle{font-size:12px}.status{font-size:10px;padding:5px 8px}.card,.post{padding:18px;border-radius:15px}#authCard{padding:22px 18px;margin-top:0}.row{gap:8px}.row button{padding:11px 9px;font-size:12px}.post h3{font-size:17px}.toolbar{margin-top:20px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;scroll-behavior:auto!important}}

</style>
</head>
<body><main>
<header><div><h1>TUBETU</h1><p class="subtitle">Direct Information Exchange Environment<br>People • Business • Resources</p></div><span id="connection" class="status">Проверка соединения…</span></header>
<section id="authCard" class="card">
<h2 id="authTitle">Вход в TUBETU</h2><p id="authIntro" class="muted">Войди или создай аккаунт, чтобы публиковать материалы.</p>
<form id="authForm">
<div id="usernameWrap" class="hidden"><label for="username">Имя аккаунта</label><input id="username" type="text" autocomplete="username" maxlength="30" placeholder="Придумай уникальное имя"></div>
<label id="identityLabel" for="email">Имя аккаунта или электронная почта</label><input id="email" type="text" autocomplete="username" required maxlength="254" placeholder="username или you@example.com">
<label for="password">Пароль</label><input id="password" type="password" minlength="8" autocomplete="current-password" required placeholder="Минимум 8 символов">
<div class="row"><button class="primary" id="authSubmit" type="submit">Войти</button><button id="authToggle" type="button">Нет аккаунта? Регистрация</button></div>
<button id="forgotPassword" type="button" style="margin-top:12px;width:100%;background:transparent">Забыли пароль? Восстановить по email</button>
</form><div id="authMessage" class="message hidden" role="status" aria-live="polite"></div>

</section>
<section id="publishCard" class="card hidden"><div class="row" style="align-items:center"><h2 style="flex:2;margin:0">Новая публикация</h2><button id="logoutBtn" type="button">Выйти</button></div><p id="userLine" class="muted"></p>
<form id="postForm"><label for="title">Заголовок</label><input id="title" maxlength="120" required placeholder="Название предложения">
<label for="description">Описание</label><textarea id="description" maxlength="10000" required placeholder="Что предлагаешь, ищешь или хочешь реализовать?"></textarea>
<label for="category">Категория</label><select id="category"><option value="Идея">Идея / Проект</option><option value="Ресурс">Ресурс / Материал</option><option value="Услуга">Работа / Услуга</option></select>
<button class="primary" id="publishBtn" type="submit" style="width:100%;margin-top:13px">Опубликовать</button></form><div id="publishMessage" class="message hidden" role="status"></div></section>
<div class="toolbar"><input id="search" type="search" maxlength="150" placeholder="Поиск публикаций…"><button id="refreshBtn" type="button">Обновить</button></div>
<div class="filters" id="filters"><button type="button" class="filter active" data-filter="Все">Все</button><button type="button" class="filter" data-filter="Идея">Идеи</button><button type="button" class="filter" data-filter="Ресурс">Ресурсы</button><button type="button" class="filter" data-filter="Услуга">Услуги</button></div>
<div id="feed" aria-live="polite"><div class="card muted">Загрузка публикаций…</div></div><footer>TUBETU · People • Business • Resources</footer>
</main>
<script>
(()=>{'use strict';
const SUPABASE_URL='https://zbgfuitelvmkrpzbpcrj.supabase.co';
const SUPABASE_KEY='sb_publishable_2TBKUjp8mXw1g1Z9WhYxpQ_wJIA-Bk_';
// GitHub Pages project path is included intentionally; do not redirect to the domain root.
const AUTH_REDIRECT='https://tubetuteam-creator.github.io/tubetu/';
const $=id=>document.getElementById(id);
const db=window.supabase?.createClient(SUPABASE_URL,SUPABASE_KEY);
let user=null,posts=[],filter='Все',loading=false,registerMode=false,recoveryMode=false;
function show(id,text,error=false){const el=$(id);el.textContent=text;el.classList.remove('hidden','error');if(error)el.classList.add('error')}
function hide(id){const el=$(id);el.textContent='';el.classList.add('hidden');el.classList.remove('error')}
function busy(id,on,label){const b=$(id);if(on){b.dataset.label=b.textContent;b.textContent=label;b.disabled=true}else{b.textContent=b.dataset.label||b.textContent;b.disabled=false}}
function explainError(e){const m=String(e?.message||e||'Неизвестная ошибка');if(/Invalid login credentials/i.test(m))return 'Неверное имя аккаунта/почта или пароль. Если аккаунта ещё нет — нажми «Регистрация». ';if(/Email not confirmed/i.test(m))return 'Supabase требует подтверждение почты. Для входа без писем нужно отключить Confirm email в настройках Auth проекта.';if(/User already registered/i.test(m))return 'Этот адрес уже зарегистрирован. Попробуй войти с паролем.';if(/Failed to fetch|NetworkError/i.test(m))return 'Не удалось соединиться с Supabase. Проверь интернет или доступность сервиса.';return m}
function authView(){ $('authCard').classList.toggle('hidden',!!user);$('publishCard').classList.toggle('hidden',!user);$('userLine').textContent=user?'Вход выполнен: '+(user.user_metadata?.username||user.email||''):''}
function setAuthMode(register){registerMode=register;recoveryMode=false;$('authTitle').textContent=register?'Создать аккаунт TUBETU':'Вход в TUBETU';$('authIntro').textContent=register?'Создай имя аккаунта, укажи почту для подтверждения и придумай пароль.':'Войди по имени аккаунта или электронной почте.';$('usernameWrap').classList.toggle('hidden',!register);$('username').required=register;$('identityLabel').textContent=register?'Электронная почта':'Имя аккаунта или электронная почта';$('email').type=register?'email':'text';$('email').autocomplete=register?'email':'username';$('email').placeholder=register?'you@example.com':'username или you@example.com';$('email').required=true;$('email').classList.remove('hidden');$('identityLabel').classList.remove('hidden');$('password').autocomplete=register?'new-password':'current-password';$('password').placeholder='Минимум 8 символов';$('authSubmit').textContent=register?'Зарегистрироваться':'Войти';$('authToggle').classList.remove('hidden');$('forgotPassword').classList.toggle('hidden',register);$('authToggle').textContent=register?'Уже есть аккаунт? Войти':'Нет аккаунта? Регистрация';hide('authMessage')}
function setRecoveryMode(){recoveryMode=true;registerMode=false;$('authTitle').textContent='Создать новый пароль';$('authIntro').textContent='Введи новый пароль для своего аккаунта TUBETU.';$('usernameWrap').classList.add('hidden');$('identityLabel').classList.add('hidden');$('email').classList.add('hidden');$('username').required=false;$('email').required=false;$('password').value='';$('password').autocomplete='new-password';$('password').placeholder='Новый пароль — минимум 8 символов';$('authSubmit').textContent='Сохранить новый пароль';$('authToggle').classList.add('hidden');$('forgotPassword').classList.add('hidden');hide('authMessage')}
async function load(){if(!db||loading)return;loading=true;$('connection').textContent='Загрузка…';$('feed').textContent='Загрузка публикаций…';try{const {data,error}=await db.from('posts').select('id,title,text,category,author_id,ai_status,ai_category,created_at').order('created_at',{ascending:false}).limit(100);if(error)throw error;posts=data||[];$('connection').textContent='База подключена';render()}catch(e){console.error('posts.load',e);$('connection').textContent='Ошибка базы';$('feed').textContent='Не удалось загрузить публикации: '+(e.message||'ошибка доступа к таблице posts')}finally{loading=false}}
function render(){const feed=$('feed');feed.replaceChildren();const q=$('search').value.trim().toLocaleLowerCase('ru');const list=posts.filter(p=>(filter==='Все'||p.category===filter)&&((p.title||'')+' '+(p.text||'')).toLocaleLowerCase('ru').includes(q));if(!list.length){const e=document.createElement('div');e.className='card muted';e.textContent='Публикаций не найдено.';feed.appendChild(e);return}for(const p of list){const a=document.createElement('article');a.className='post';const top=document.createElement('div');top.className='post-top';const tag=document.createElement('span');tag.className='tag';tag.textContent=p.category||'Без категории';const time=document.createElement('time');if(p.created_at){const d=new Date(p.created_at);time.textContent=isNaN(d.getTime())?'':d.toLocaleString('ru-RU')}top.append(tag,time);const h=document.createElement('h3');h.textContent=p.title||'Публикация';const body=document.createElement('div');body.className='post-text';body.textContent=p.text||'';const ai=document.createElement('div');ai.className='ai';const strong=document.createElement('strong');strong.textContent='ИИ-анализ: ';const states={pending:'Ожидает обработки',processing:'Обработка выполняется',reviewed:'Обработка завершена',failed:'Обработка не выполнена'};ai.append(strong,document.createTextNode((states[p.ai_status]||'Статус не указан')+(p.ai_category?' · Категория: '+p.ai_category:'')));a.append(top,h,body,ai);feed.appendChild(a)}}
async function authenticate(){hide('authMessage');if(!db)return show('authMessage','Supabase SDK не загрузился. Обнови страницу и проверь соединение.',true);const identity=$('email').value.trim(),password=$('password').value,username=$('username').value.trim();if(recoveryMode){if(password.length<8)return show('authMessage','Новый пароль должен содержать минимум 8 символов.',true);busy('authSubmit',true,'Сохраняем…');try{const {error}=await db.auth.updateUser({password});if(error)throw error;recoveryMode=false;show('authMessage','Пароль изменён. Теперь можно пользоваться аккаунтом.');authView()}catch(e){console.error('password.update',e);show('authMessage',explainError(e),true)}finally{busy('authSubmit',false)}return}const email=identity;if(registerMode&&(!/^[a-zA-Z0-9_.-]{3,30}$/.test(username)))return show('authMessage','Имя аккаунта: 3–30 символов, латинские буквы, цифры, точка, дефис или подчёркивание.',true);if(!identity||password.length<8)return show('authMessage','Укажи имя аккаунта или почту и пароль минимум из 8 символов.',true);if(!registerMode&&!identity.includes('@'))return show('authMessage','Вход по имени аккаунта будет доступен после подключения серверного поиска аккаунта. Пока используй электронную почту.',true);if(registerMode&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email))return show('authMessage','Укажи корректную электронную почту.',true);busy('authSubmit',true,registerMode?'Создаём аккаунт…':'Входим…');try{if(registerMode){const {data,error}=await db.auth.signUp({email,password,options:{emailRedirectTo:AUTH_REDIRECT,data:{username}}});if(error)throw error;if(data.session&&data.user){user=data.user;authView();show('authMessage','Аккаунт создан. Вход выполнен.');await load()}else{show('authMessage','Аккаунт создан. Проверь почту и нажми ссылку подтверждения, чтобы активировать аккаунт. Если письмо не пришло, проверь папку «Спам».');}}else{const {data,error}=await db.auth.signInWithPassword({email,password});if(error)throw error;user=data.user;authView();hide('authMessage');await load()}}catch(e){console.error('auth',e);show('authMessage',explainError(e),true);}finally{busy('authSubmit',false)}}
$('authForm').addEventListener('submit',e=>{e.preventDefault();authenticate()});$('authToggle').addEventListener('click',()=>setAuthMode(!registerMode));
$('forgotPassword').addEventListener('click',async()=>{hide('authMessage');if(!db)return show('authMessage','Supabase SDK не загрузился. Обнови страницу.',true);const email=$('email').value.trim();if(!/^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$/.test(email))return show('authMessage','Сначала введи свой email в поле выше, затем нажми «Восстановить по email».',true);busy('forgotPassword',true,'Отправляем письмо…');try{const {error}=await db.auth.resetPasswordForEmail(email,{redirectTo:AUTH_REDIRECT});if(error)throw error;show('authMessage','Если для этого email существует аккаунт, письмо для восстановления пароля отправлено. Проверь входящие и папку «Спам».')}catch(e){console.error('password.reset.request',e);show('authMessage',explainError(e),true)}finally{busy('forgotPassword',false)}});
$('postForm').addEventListener('submit',async e=>{e.preventDefault();hide('publishMessage');if(!db||!user)return show('publishMessage','Сначала войди в аккаунт.',true);const title=$('title').value.trim(),text=$('description').value.trim(),category=$('category').value;if(!title||!text)return show('publishMessage','Заполни заголовок и описание.',true);busy('publishBtn',true,'Публикуем…');try{const {error}=await db.from('posts').insert({title,text,category,author_id:user.id});if(error)throw error;$('title').value='';$('description').value='';show('publishMessage','Публикация сохранена.');await load()}catch(e){console.error('posts.insert',e);show('publishMessage','Не удалось опубликовать: '+explainError(e),true)}finally{busy('publishBtn',false)}});
$('logoutBtn').addEventListener('click',async()=>{try{const {error}=await db.auth.signOut();if(error)throw error;user=null;authView()}catch(e){show('publishMessage',explainError(e),true)}});
$('refreshBtn').addEventListener('click',load);$('search').addEventListener('input',render);$('filters').addEventListener('click',e=>{const b=e.target.closest('[data-filter]');if(!b)return;filter=b.dataset.filter;$('filters').querySelectorAll('[data-filter]').forEach(x=>x.classList.toggle('active',x===b));render()});
async function init(){if(!db){$('connection').textContent='Ошибка SDK';$('feed').textContent='Не удалось загрузить Supabase SDK. Проверь подключение к интернету.';return}try{const {data,error}=await db.auth.getSession();if(error)throw error;user=data.session?.user||null;authView();db.auth.onAuthStateChange((event,session)=>{if(event==='PASSWORD_RECOVERY'){setRecoveryMode();return}user=session?.user||null;authView()});await load()}catch(e){console.error('init',e);$('connection').textContent='Ошибка подключения';$('feed').textContent='Не удалось инициализировать Supabase: '+(e.message||'ошибка')}}
init();
})();
</script></body></html>
